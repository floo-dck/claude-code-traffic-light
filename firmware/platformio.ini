; Reproducible build for a generic ESP32 DevKit with a CH340 USB bridge.
; The port is deliberately not pinned: PlatformIO detects it, so the board
; moving from COM3 to COM4 needs no edit here.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -Wall

; A worked example of overriding the defaults in include/pins.h: different
; pins and a common-anode module, where LOW lights the LED. Built in CI so
; the override path cannot rot unnoticed.
[env:esp32dev_common_anode]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -Wall
    -DPIN_RED=18
    -DPIN_YELLOW=19
    -DPIN_GREEN=21
    -DLED_ACTIVE_LOW=1
