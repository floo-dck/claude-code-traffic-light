name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host:
    # The Ubuntu leg is the evidence behind the portability sentence in the
    # README: the tests redirect every path through CLAUDE_TRAFFIC_LIGHT_HOME
    # and substitute a fake serial port, so they touch neither hardware nor a
    # real settings file on any operating system.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r host/requirements.txt
      - run: python -m pytest host/tests -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Cache the PlatformIO toolchain
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: python -m pip install --upgrade platformio
      # Both environments: the second one is what proves the pin override in
      # include/pins.h still compiles.
      - run: python -m platformio run --project-dir firmware
